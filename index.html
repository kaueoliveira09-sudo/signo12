<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0820">
<title>Descubra Seu Signo</title>

<!-- Fontes (opcional: se estiver offline, o navegador usa as fontes de reserva) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. VARIÁVEIS (edite aqui para mudar as cores do site)
   ========================================================= */
:root {
  --bg-1: #070516;          /* azul bem escuro */
  --bg-2: #120a35;          /* roxo profundo   */
  --bg-3: #1c1150;          /* roxo médio      */
  --purple: #8b5cf6;
  --purple-soft: #c4b5fd;
  --gold: #f5c76b;
  --gold-strong: #ffd98a;
  --text: #ece8ff;
  --muted: #a9a2d0;
  --card: rgba(22, 14, 62, .62);
  --card-border: rgba(196, 181, 253, .22);
  --accent: var(--purple);  /* muda conforme o elemento do signo */
  --font-title: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif;
  --font-body: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

/* =========================================================
   2. BASE
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, rgba(139, 92, 246, .28), transparent 50%),
    radial-gradient(ellipse at 85% 90%, rgba(245, 199, 107, .12), transparent 45%),
    linear-gradient(170deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
  background-attachment: fixed;
  overflow-x: hidden;
}
#cosmos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* Planetas decorativos (CSS puro) */
.planeta { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; transition: transform .3s ease-out; }
.planeta.p1 { /* planeta roxo com anel */
  width: clamp(90px, 14vw, 190px); aspect-ratio: 1; top: 8%; right: 6%;
  background: radial-gradient(circle at 30% 30%, #c4b5fd, #7c3aed 45%, #2e1065 90%);
  box-shadow: 0 0 60px rgba(139, 92, 246, .55), inset -18px -12px 30px rgba(0, 0, 0, .55);
  animation: flutuar 14s ease-in-out infinite;
}
.planeta.p1::after {
  content: ''; position: absolute; left: -35%; right: -35%; top: 42%; height: 16%;
  border: 2px solid rgba(245, 199, 107, .55); border-radius: 50%;
  transform: rotate(-18deg); box-shadow: 0 0 14px rgba(245, 199, 107, .35);
}
.planeta.p2 { /* planeta dourado pequeno */
  width: clamp(40px, 6vw, 80px); aspect-ratio: 1; bottom: 14%; left: 7%;
  background: radial-gradient(circle at 32% 30%, #fff1c4, #f5c76b 50%, #8a5a00 95%);
  box-shadow: 0 0 40px rgba(245, 199, 107, .45), inset -8px -6px 16px rgba(0, 0, 0, .45);
  animation: flutuar 11s ease-in-out infinite reverse;
}
.planeta.p3 { /* lua azulada */
  width: clamp(50px, 8vw, 110px); aspect-ratio: 1; top: 58%; right: 12%;
  background: radial-gradient(circle at 30% 30%, #bfdbfe, #3b82f6 55%, #0b1b4d 95%);
  box-shadow: 0 0 45px rgba(59, 130, 246, .4), inset -10px -8px 20px rgba(0, 0, 0, .5);
  opacity: .8; animation: flutuar 17s ease-in-out infinite;
}
@keyframes flutuar { 0%, 100% { translate: 0 0; } 50% { translate: 0 -18px; } }

/* =========================================================
   3. LAYOUT GERAL
   ========================================================= */
main {
  position: relative; z-index: 1;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 32px 16px;
}
.tela { width: 100%; max-width: 980px; }
.tela[hidden] { display: none; }

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
}

/* =========================================================
   4. TELA INICIAL
   ========================================================= */
#tela-form { max-width: 520px; animation: entrar 1s ease both; }
.hero { padding: 44px 32px 38px; text-align: center; }

.roda { /* roda zodiacal giratória */
  width: 104px; height: 104px; margin: 0 auto 22px; position: relative;
  display: grid; place-items: center; font-size: 2.3rem; color: var(--gold);
  border-radius: 50%; border: 2px solid rgba(245, 199, 107, .6);
  background: radial-gradient(circle, rgba(139, 92, 246, .35), rgba(18, 10, 53, .9));
  box-shadow: 0 0 34px rgba(139, 92, 246, .6), 0 0 70px rgba(245, 199, 107, .2);
  text-shadow: 0 0 16px var(--gold);
}
.roda::before {
  content: ''; position: absolute; inset: -10px; border-radius: 50%;
  border: 1px dashed rgba(196, 181, 253, .55); animation: girar 24s linear infinite;
}
.roda::after {
  content: ''; position: absolute; inset: -22px; border-radius: 50%;
  border: 1px dotted rgba(245, 199, 107, .4); animation: girar 40s linear infinite reverse;
}
@keyframes girar { to { transform: rotate(360deg); } }

h1 {
  font-family: var(--font-title); font-weight: 900; line-height: 1.1;
  font-size: clamp(2rem, 6vw, 2.9rem); letter-spacing: .03em;
  background: linear-gradient(100deg, var(--gold-strong), #fff 45%, var(--purple-soft));
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: brilho 6s linear infinite;
}
@keyframes brilho { to { background-position: 200% center; } }
.frase { margin: 14px 0 28px; color: var(--muted); font-weight: 300; font-size: 1.02rem; line-height: 1.6; }

form { text-align: left; }
label { display: block; margin-bottom: 8px; font-weight: 500; font-size: .92rem; color: var(--purple-soft); }
input[type="date"] {
  width: 100%; padding: 15px 18px; font: inherit; font-size: 1.05rem; color: var(--text);
  background: rgba(10, 6, 34, .65); border: 1px solid var(--card-border); border-radius: 16px;
  color-scheme: dark; outline: none; transition: border-color .25s, box-shadow .25s;
}
input[type="date"]:focus { border-color: var(--purple); box-shadow: 0 0 0 4px rgba(139, 92, 246, .28); }
input[type="date"].invalido { border-color: #fb7185; box-shadow: 0 0 0 4px rgba(251, 113, 133, .2); }

.erro {
  min-height: 1.4em; margin: 10px 2px 0; font-size: .9rem; color: #fda4af;
}

.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 16px; padding: 16px 28px; cursor: pointer;
  font: 600 1.05rem var(--font-body); letter-spacing: .02em; color: #1a1033;
  border: 0; border-radius: 18px;
  background: linear-gradient(120deg, var(--gold), var(--gold-strong) 50%, var(--gold));
  background-size: 200% auto;
  box-shadow: 0 8px 28px rgba(245, 199, 107, .35), 0 0 0 0 rgba(245, 199, 107, .5);
  transition: transform .2s, box-shadow .2s, background-position .5s;
  animation: pulso 2.8s ease-in-out infinite;
}
.btn:hover { transform: translateY(-3px) scale(1.015); background-position: 100% 0; box-shadow: 0 14px 38px rgba(245, 199, 107, .5); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:focus-visible { outline: 3px solid var(--purple-soft); outline-offset: 3px; }
.btn::after { /* faixa de luz que atravessa o botão */
  content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
  transform: skewX(-20deg); animation: faixa 3.6s ease-in-out infinite;
}
@keyframes faixa { 0% { left: -60%; } 55%, 100% { left: 140%; } }
@keyframes pulso { 50% { box-shadow: 0 8px 28px rgba(245, 199, 107, .35), 0 0 0 10px rgba(245, 199, 107, 0); } }
.btn.secundario {
  width: auto; margin-top: 0; color: var(--text); animation: none;
  background: rgba(139, 92, 246, .22); border: 1px solid var(--purple);
  box-shadow: 0 0 24px rgba(139, 92, 246, .3);
}
.btn.secundario::after { display: none; }
.btn.secundario:hover { background: rgba(139, 92, 246, .4); box-shadow: 0 0 34px rgba(139, 92, 246, .55); }
.aviso { margin-top: 22px; font-size: .78rem; color: var(--muted); opacity: .8; text-align: center; }

/* =========================================================
   5. TELA DE RESULTADO
   ========================================================= */
#tela-resultado { padding: 8px 0 24px; }
.cabeca { text-align: center; padding: 40px 24px 34px; position: relative; overflow: hidden; }
.cabeca::before { /* halo atrás do símbolo */
  content: ''; position: absolute; left: 50%; top: 0; width: 520px; height: 520px; translate: -50% -22%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 45%, transparent), transparent 62%);
  animation: respirar 5s ease-in-out infinite; pointer-events: none;
}
@keyframes respirar { 50% { opacity: .55; scale: 1.12; } }
.nascimento { position: relative; color: var(--muted); font-size: .95rem; margin-bottom: 10px; }
.simbolo {
  position: relative; width: 150px; height: 150px; margin: 6px auto 12px; display: grid; place-items: center;
  font-size: 5rem; line-height: 1; color: var(--gold-strong);
  text-shadow: 0 0 24px var(--accent), 0 0 60px var(--accent);
  border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 70%, white);
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, #0a0622), #0a0622 75%);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 65%, transparent);
}
.simbolo::before, .simbolo::after {
  content: ''; position: absolute; border-radius: 50%;
}
.simbolo::before { inset: -14px; border: 1px dashed rgba(245, 199, 107, .6); animation: girar 20s linear infinite; }
.simbolo::after  { inset: -28px; border: 1px dotted rgba(196, 181, 253, .45); animation: girar 34s linear infinite reverse; }
.nome-signo {
  position: relative; font-family: var(--font-title); font-weight: 900;
  font-size: clamp(2.4rem, 9vw, 4.4rem); line-height: 1.05; letter-spacing: .04em;
  background: linear-gradient(100deg, var(--gold-strong), #fff, var(--gold-strong));
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: brilho 5s linear infinite;
  outline: none;
}
.chips { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
.chip {
  padding: 8px 18px; border-radius: 999px; font-size: .9rem; font-weight: 500;
  background: rgba(10, 6, 34, .6); border: 1px solid var(--card-border); color: var(--text);
}
.chip.elemento {
  border-color: var(--accent); color: #fff;
  background: color-mix(in srgb, var(--accent) 30%, rgba(10, 6, 34, .7));
}

.grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 18px; }
.bloco { padding: 26px 26px 24px; }
.bloco.largo { grid-column: 1 / -1; }
.bloco h2 {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  font-family: var(--font-title); font-size: 1.15rem; letter-spacing: .05em; color: var(--gold);
}
.bloco p { line-height: 1.75; color: var(--text); font-weight: 300; }
.bloco ul { list-style: none; display: grid; gap: 10px; }
.bloco li { position: relative; padding-left: 26px; line-height: 1.5; font-weight: 300; }
.bloco li::before { position: absolute; left: 0; top: 0; }
.fortes li::before { content: '✦'; color: #86efac; }
.fracos li::before { content: '✧'; color: #fdba74; }

.compat { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.par {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
  background: rgba(244, 114, 182, .14); border: 1px solid rgba(244, 114, 182, .45); font-weight: 500;
}
.par span:first-child { font-size: 1.2rem; color: var(--gold-strong); }

.mensagem {
  text-align: center; position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgba(139, 92, 246, .3), rgba(245, 199, 107, .14));
  border-color: rgba(245, 199, 107, .45);
}
.mensagem blockquote {
  font-family: var(--font-title); font-size: clamp(1.1rem, 3.2vw, 1.5rem); line-height: 1.6; color: var(--gold-strong);
  max-width: 700px; margin: 0 auto; text-wrap: balance;
}
.mensagem blockquote::before { content: '“'; display: block; font-size: 3rem; line-height: .6; opacity: .6; }
.acoes { display: flex; justify-content: center; margin-top: 26px; }

/* Animação especial de entrada do resultado */
#tela-resultado.revelar .cabeca { animation: revelar 1.1s cubic-bezier(.2, .9, .3, 1.2) both; }
#tela-resultado.revelar .simbolo { animation: surgir 1.4s cubic-bezier(.2, .9, .3, 1.25) both .15s; }
#tela-resultado.revelar .bloco, #tela-resultado.revelar .acoes { animation: subir .8s ease both; animation-delay: calc(.55s + var(--i, 0) * .12s); }
@keyframes revelar { from { opacity: 0; transform: scale(.92); filter: blur(10px); } }
@keyframes surgir { 0% { opacity: 0; transform: scale(.1) rotate(-200deg); } 100% { opacity: 1; transform: none; } }
@keyframes subir { from { opacity: 0; transform: translateY(34px); } }
@keyframes entrar { from { opacity: 0; transform: translateY(26px) scale(.97); } }

/* Transição entre telas */
.sair { animation: sumir .45s ease forwards; }
@keyframes sumir { to { opacity: 0; transform: scale(.94) translateY(-14px); filter: blur(8px); } }

/* =========================================================
   6. RESPONSIVO
   ========================================================= */
@media (max-width: 720px) {
  .grade { grid-template-columns: 1fr; }
  .hero { padding: 36px 22px 30px; }
  .bloco { padding: 22px; }
  .simbolo { width: 124px; height: 124px; font-size: 4rem; }
  .planeta.p3 { display: none; }
}

/* Respeita quem prefere menos movimento */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<body>

<!-- Fundo animado -->
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="planeta p1" aria-hidden="true" data-prof="14"></div>
<div class="planeta p2" aria-hidden="true" data-prof="-22"></div>
<div class="planeta p3" aria-hidden="true" data-prof="9"></div>

<main>
  <!-- ======================= TELA INICIAL ======================= -->
  <section id="tela-form" class="tela" aria-labelledby="titulo">
    <div class="card hero">
      <div class="roda" aria-hidden="true">✦</div>
      <h1 id="titulo">Descubra Seu Signo</h1>
      <p class="frase">Os astros têm algo especial para revelar sobre você</p>

      <form id="form" novalidate>
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" min="1900-01-01" required aria-describedby="erro">
        <p id="erro" class="erro" role="alert" aria-live="assertive"></p>
        <button type="submit" class="btn">✨ Descobrir meu signo</button>
      </form>
      <p class="aviso">Conteúdo feito para diversão e autoconhecimento.</p>
    </div>
  </section>

  <!-- ======================= TELA DE RESULTADO ======================= -->
  <section id="tela-resultado" class="tela" hidden aria-live="polite">
    <header class="card cabeca">
      <p class="nascimento" id="r-nascimento"></p>
      <div class="simbolo" id="r-simbolo" aria-hidden="true"></div>
      <h2 class="nome-signo" id="r-nome" tabindex="-1"></h2>
      <div class="chips">
        <span class="chip" id="r-periodo"></span>
        <span class="chip elemento" id="r-elemento"></span>
        <span class="chip" id="r-planeta"></span>
      </div>
    </header>

    <div class="grade">
      <article class="card bloco largo" style="--i:0">
        <h2>🔮 Personalidade</h2>
        <p id="r-personalidade"></p>
      </article>
      <article class="card bloco fortes" style="--i:1">
        <h2>🌟 Pontos fortes</h2>
        <ul id="r-fortes"></ul>
      </article>
      <article class="card bloco fracos" style="--i:2">
        <h2>🌙 Pontos fracos</h2>
        <ul id="r-fracos"></ul>
      </article>
      <article class="card bloco largo" style="--i:3">
        <h2>💞 Compatibilidade amorosa</h2>
        <div class="compat" id="r-compat"></div>
        <p id="r-compat-texto"></p>
      </article>
      <article class="card bloco largo mensagem" style="--i:4">
        <h2 style="justify-content:center">💌 Mensagem especial</h2>
        <blockquote id="r-mensagem"></blockquote>
      </article>
    </div>

    <div class="acoes" style="--i:5">
      <button type="button" class="btn secundario" id="btn-novamente">↺ Descobrir novamente</button>
    </div>
  </section>
</main>

<script>

// Cor de destaque de cada elemento (usada no resultado)
const COR_ELEMENTO = { 'Fogo': '#f97316', 'Terra': '#22c55e', 'Ar': '#38bdf8', 'Água': '#6366f1' };
const EMOJI_ELEMENTO = { 'Fogo': '🔥', 'Terra': '🌿', 'Ar': '💨', 'Água': '💧' };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* =========================================================
   2. LÓGICA: validar data e descobrir o signo
   ========================================================= */

/** Valida "AAAA-MM-DD". Retorna { ok, erro, ano, mes, dia }. */
function validarData(valor) {
  if (!valor) return { ok: false, erro: 'Informe sua data de nascimento.' };

  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(valor);
  if (!m) return { ok: false, erro: 'Data inválida. Use o formato dia/mês/ano.' };

  const ano = +m[1], mes = +m[2], dia = +m[3];
  const d = new Date(ano, mes - 1, dia);
  const existe = d.getFullYear() === ano && d.getMonth() === mes - 1 && d.getDate() === dia;
  if (!existe) return { ok: false, erro: 'Essa data não existe no calendário.' };

  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  if (d > hoje) return { ok: false, erro: 'A data de nascimento não pode estar no futuro.' };
  if (ano < 1900) return { ok: false, erro: 'Informe uma data a partir de 1900.' };

  return { ok: true, ano, mes, dia };
}

/** Encontra o signo a partir do mês e dia (trata o intervalo que cruza o ano). */
function descobrirSigno(mes, dia) {
  const md = mes * 100 + dia;
  return SIGNOS.find(s => {
    const ini = s.inicio[0] * 100 + s.inicio[1];
    const fim = s.fim[0] * 100 + s.fim[1];
    return ini <= fim ? (md >= ini && md <= fim) : (md >= ini || md <= fim);
  });
}

/* =========================================================
   3. INTERFACE
   ========================================================= */
const $ = id => document.getElementById(id);
const telaForm = $('tela-form'), telaRes = $('tela-resultado');
const campo = $('nascimento'), erroEl = $('erro');

// Data máxima do campo = hoje (horário local)
(function definirMax() {
  const h = new Date();
  campo.max = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, '0')}-${String(h.getDate()).padStart(2, '0')}`;
})();

function mostrarErro(msg) {
  erroEl.textContent = msg;
  campo.classList.toggle('invalido', !!msg);
  campo.setAttribute('aria-invalid', msg ? 'true' : 'false');
}
campo.addEventListener('input', () => mostrarErro(''));

/** Cria uma lista <li> a partir de um array de textos. */
function preencherLista(id, itens) {
  const ul = $(id); ul.innerHTML = '';
  itens.forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
}

/** Preenche a tela de resultado com os dados do signo. */
function renderizarResultado(signo, data) {
  telaRes.style.setProperty('--accent', COR_ELEMENTO[signo.elemento]);
  $('r-nascimento').textContent = `Nascido(a) em ${data.dia} de ${MESES[data.mes - 1]} de ${data.ano}, seu signo é`;
  $('r-simbolo').textContent = signo.simbolo;
  $('r-nome').textContent = signo.nome;
  $('r-periodo').textContent = '📅 ' + signo.periodo;
  $('r-elemento').textContent = `${EMOJI_ELEMENTO[signo.elemento]} Elemento ${signo.elemento}`;
  $('r-planeta').textContent = '🪐 Regente: ' + signo.planeta;
  $('r-personalidade').textContent = signo.personalidade;
  preencherLista('r-fortes', signo.fortes);
  preencherLista('r-fracos', signo.fracos);
  $('r-mensagem').textContent = signo.mensagem;
  $('r-compat-texto').textContent = signo.compatTexto;

  const box = $('r-compat'); box.innerHTML = '';
  signo.compat.forEach(nome => {
    const outro = SIGNOS.find(s => s.nome === nome);
    const el = document.createElement('div'); el.className = 'par';
    el.innerHTML = '<span></span><span></span>';
    el.children[0].textContent = outro.simbolo;
    el.children[1].textContent = outro.nome;
    box.appendChild(el);
  });
}

/** Troca de tela com uma pequena animação de saída. */
function trocarTela(de, para, aoTerminar) {
  de.classList.add('sair');
  setTimeout(() => {
    de.hidden = true; de.classList.remove('sair');
    para.hidden = false;
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    aoTerminar && aoTerminar();
  }, 450);
}

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const r = validarData(campo.value);
  if (!r.ok) { mostrarErro(r.erro); campo.focus(); return; }

  const signo = descobrirSigno(r.mes, r.dia);
  renderizarResultado(signo, r);

  // Reinicia a animação de revelação
  telaRes.classList.remove('revelar');
  trocarTela(telaForm, telaRes, () => {
    void telaRes.offsetWidth;            // força o navegador a reiniciar a animação
    telaRes.classList.add('revelar');
    const c = $('r-simbolo').getBoundingClientRect();
    explosao(c.left + c.width / 2, c.top + c.height / 2, COR_ELEMENTO[signo.elemento]);
    setTimeout(() => $('r-nome').focus({ preventScroll: true }), 900);
  });
});

$('btn-novamente').addEventListener('click', () => {
  campo.value = ''; mostrarErro('');
  trocarTela(telaRes, telaForm, () => campo.focus({ preventScroll: true }));
});

/* =========================================================
   4. FUNDO ANIMADO: estrelas, poeira cósmica, estrelas cadentes
      e explosão de partículas quando o resultado aparece
   ========================================================= */
const canvas = $('cosmos'), ctx = canvas.getContext('2d');
const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, DPR, estrelas = [], poeira = [], cadentes = [], faiscas = [];
const CORES_ESTRELA = ['255,255,255', '255,236,190', '196,181,253', '160,196,255'];

function ajustarCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const qtdEstrelas = Math.min(260, Math.floor(W * H / 5500));
  estrelas = Array.from({ length: qtdEstrelas }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + .3,
    fase: Math.random() * Math.PI * 2, vel: Math.random() * .02 + .005,
    cor: CORES_ESTRELA[(Math.random() * CORES_ESTRELA.length) | 0]
  }));
  poeira = Array.from({ length: Math.min(55, Math.floor(W / 24)) }, () => novaPoeira(true));
}
function novaPoeira(inicio) {
  return {
    x: Math.random() * W, y: inicio ? Math.random() * H : H + 10,
    r: Math.random() * 2.2 + .6, vy: -(Math.random() * .3 + .08), vx: (Math.random() - .5) * .2,
    a: Math.random() * .5 + .15, ouro: Math.random() > .55
  };
}

/** Cria uma explosão de partículas no ponto (x, y). */
function explosao(x, y, corHex) {
  if (reduzir) return;
  for (let i = 0; i < 90; i++) {
    const ang = Math.random() * Math.PI * 2, vel = Math.random() * 6 + 1.5;
    faiscas.push({
      x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
      r: Math.random() * 2.6 + .8, vida: 1, queda: Math.random() * .012 + .008,
      cor: Math.random() > .5 ? '245,199,107' : hexParaRgb(corHex)
    });
  }
}
function hexParaRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return `${n >> 16},${(n >> 8) & 255},${n & 255}`;
}

let ultimoCadente = 0;
function desenhar(t) {
  ctx.clearRect(0, 0, W, H);

  // Estrelas piscando
  for (const e of estrelas) {
    e.fase += e.vel;
    const brilho = .35 + .65 * Math.abs(Math.sin(e.fase));
    ctx.beginPath();
    ctx.fillStyle = `rgba(${e.cor},${brilho})`;
    ctx.shadowColor = `rgba(${e.cor},.9)`; ctx.shadowBlur = e.r * 4;
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Poeira cósmica subindo devagar
  for (const p of poeira) {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10) Object.assign(p, novaPoeira(false));
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
    const c = p.ouro ? '245,199,107' : '167,139,250';
    g.addColorStop(0, `rgba(${c},${p.a})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2); ctx.fill();
  }

  // Estrela cadente de tempos em tempos
  if (!reduzir && t - ultimoCadente > 3500 + Math.random() * 4000) {
    ultimoCadente = t;
    cadentes.push({ x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .4, vx: -(Math.random() * 6 + 7), vy: Math.random() * 3 + 3, vida: 1 });
  }
  for (let i = cadentes.length - 1; i >= 0; i--) {
    const c = cadentes[i];
    c.x += c.vx; c.y += c.vy; c.vida -= .016;
    if (c.vida <= 0) { cadentes.splice(i, 1); continue; }
    const g = ctx.createLinearGradient(c.x, c.y, c.x - c.vx * 9, c.y - c.vy * 9);
    g.addColorStop(0, `rgba(255,255,255,${c.vida})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx * 9, c.y - c.vy * 9); ctx.stroke();
  }

  // Faíscas da explosão
  for (let i = faiscas.length - 1; i >= 0; i--) {
    const f = faiscas[i];
    f.x += f.vx; f.y += f.vy; f.vx *= .97; f.vy *= .97; f.vy += .04; f.vida -= f.queda;
    if (f.vida <= 0) { faiscas.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = `rgba(${f.cor},${f.vida})`;
    ctx.shadowColor = `rgba(${f.cor},1)`; ctx.shadowBlur = 12;
    ctx.arc(f.x, f.y, f.r * f.vida + .3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  requestAnimationFrame(desenhar);
}

window.addEventListener('resize', ajustarCanvas);
ajustarCanvas();
requestAnimationFrame(desenhar);

// Efeito de profundidade: os planetas se movem levemente com o mouse
const planetas = document.querySelectorAll('.planeta');
if (!reduzir) {
  window.addEventListener('mousemove', e => {
    const dx = e.clientX / window.innerWidth - .5, dy = e.clientY / window.innerHeight - .5;
    planetas.forEach(p => {
      const k = +p.dataset.prof;
      p.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    });
  });
}
